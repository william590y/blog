<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <script>document.documentElement.classList.add('js');</script>

    {% seo %}

    <!-- CSS: the Tale theme, then the manuscript styling on top -->
    <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=UnifrakturMaguntia&family=Uncial+Antiqua&display=swap">
    <link rel="stylesheet" href="{{ "/assets/css/manuscript.css" | relative_url }}">
    <script src="{{ "/assets/js/illuminate.js" | relative_url }}" defer></script>

    <!-- Math (was before the doctype, which put every page in quirks mode) -->
    <script type="text/javascript" async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.1/MathJax.js?config=TeX-AMS-MML_HTMLorMML"></script>

    <!-- Favicon -->
     <!--
    <link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/favicon-32x32.png" | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ "/assets/favicon-16x16.png" | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ "/assets/apple-touch-icon.png" | relative_url }}">
    -->

    <link rel="shortcut icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">

    <!-- RSS -->
    {% feed_meta %}

    <!-- Google Analytics-->
    {% if site.google_analytics and jekyll.environment == 'production' %}
    {% include analytics.html %}
    {% endif %}
  </head>
