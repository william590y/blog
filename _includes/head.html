<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
    {% seo %}
  
    <!-- CSS -->
    <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
    <link rel="preload" href="{{ "/assets/fonts/EBGaramond-Scriptorium.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>
    <!-- Scriptorium look (normal mode, light): overrides Tale's main.css -->
    <link rel="stylesheet" href="{{ "/assets/scriptorium-site.css" | relative_url }}?v={{ site.time | date: '%s' }}">
    <link rel="preload" href="{{ "/assets/fonts/Yinit-Scriptorium.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>
    <script>
      // Use the Yinit initials once the font has loaded. Switching on a class makes every browser redraw the
      // ::first-letter (WebKit can otherwise keep the fallback letter it drew before the font arrived).
      (function () {
        var root = document.documentElement;
        if (!document.fonts || !document.fonts.load) { root.classList.add('yinit'); return; }
        document.fonts.load('1em "Yinit"').then(function (faces) { if (faces.length) root.classList.add('yinit'); });
        // Pages whose front matter asks for Goudy initials (About) load that face too.
        document.addEventListener('DOMContentLoaded', function () {
          if (!document.querySelector('.initial-goudy')) return;
          document.fonts.load('1em "Goudy Initialen"').then(function (faces) { if (faces.length) root.classList.add('goudy'); });
        });
      })();
    </script>
  
    <!-- Favicon -->
     <!--
    <link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/favicon-32x32.png" | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ "/assets/favicon-16x16.png" | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ "/assets/apple-touch-icon.png" | relative_url }}">
    -->

    <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}?v={{ site.time | date: '%s' }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ '/favicon.png' | relative_url }}?v={{ site.time | date: '%s' }}">
    <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}?v={{ site.time | date: '%s' }}">
  
    <!-- RSS -->
    {% feed_meta %}
  
    <!-- Google Analytics-->
    {% if site.google_analytics and jekyll.environment == 'production' %}
    {% include analytics.html %}
    {% endif %}
    <!-- Maths: MathJax 3 with SVG output (MathJax 2 misplaced vector arrows on phones). Kramdown writes \( \) and \[ \]. -->
    <script>
      // A display equation wider than the text column shrinks to fit (down to 60%); past that it scrolls inside itself.
      window.fitDisplayMath = function () {
        document.querySelectorAll('mjx-container[display="true"]').forEach(function (box) {
          box.style.fontSize = '';
          var svg = box.querySelector('svg');
          if (!svg) return;
          var need = svg.getBoundingClientRect().width, room = box.clientWidth;
          if (need > room) box.style.fontSize = (100 * Math.max(0.6, 0.98 * room / need)).toFixed(1) + '%';
        });
      };
      window.MathJax = {
        tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]'], ['$$', '$$']] },
        svg: { fontCache: 'global' },
        startup: { pageReady: function () { return MathJax.startup.defaultPageReady().then(window.fitDisplayMath); } }
      };
      // The subtitle under a page title shrinks to fit one line (never below 12 px; past that it wraps).
      window.fitSubtitle = function () {
        var el = document.querySelector('.post-info');
        if (!el) return;
        el.style.fontSize = '';
        el.style.whiteSpace = 'nowrap';
        var size = parseFloat(getComputedStyle(el).fontSize), need = el.scrollWidth, room = el.clientWidth;
        if (need <= room) return;
        var fit = 0.98 * size * room / need;
        if (fit >= 12) el.style.fontSize = fit.toFixed(2) + 'px'; else el.style.whiteSpace = '';
      };
      document.addEventListener('DOMContentLoaded', function () {
        (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(window.fitSubtitle);
      });
      var fitTimer;
      window.addEventListener('resize', function () {
        clearTimeout(fitTimer);
        fitTimer = setTimeout(function () { window.fitDisplayMath(); window.fitSubtitle(); }, 150);
      });
    </script>
    <script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js"></script>
  </head>
