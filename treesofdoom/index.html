<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101718">
  <title>Trees of Doom · William Liaw</title>
  <style>
    * {box-sizing:border-box} html,body {margin:0;min-height:100%;background:#101718;color:#f5f8f7;font:16px system-ui,sans-serif}
    body {min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    main {display:flex;flex-direction:column;align-items:center;width:100%;gap:12px;padding:14px}
    h1 {font-size:1.4rem;margin:0} #screen {display:block;width:min(100%,calc((100dvh - 120px)*2/3),480px);height:auto;aspect-ratio:2/3;touch-action:none;background:#000}
    button {font:inherit;border:0;border-radius:7px;padding:12px 22px;background:#d9efb1;color:#17220a;cursor:pointer} button:disabled {opacity:.6;cursor:wait}
    #status {margin:0;max-width:34rem;text-align:center;font-size:.9rem;color:#c7d3d2}
    #diagnostics {width:100%;max-width:900px;font:12px ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto}
    [hidden] {display:none!important}
  </style>
</head>
<body>
  <main>
    <h1>Trees of Doom</h1>
    <canvas id="screen" width="320" height="480" aria-label="Trees of Doom game"></canvas>
    <button id="play">Play</button>
    <p id="status" role="status">Original game · Runs on your device · First download about 44 MB</p>
    <pre id="diagnostics" hidden></pre>
  </main>
  <script src="./vendor/unicorn_arm.js"></script>
  <script type="module" src="./main.mjs"></script>
</body>
</html>
